[package]
name = "trap-run-registry"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

