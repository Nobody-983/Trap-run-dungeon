<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="voltGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b57bff" />
      <stop offset="100%" stop-color="#9d4dff" />
    </linearGradient>
    <linearGradient id="acidGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4ff4d" />
      <stop offset="100%" stop-color="#8fd116" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dungeon Shield Backdrop -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#0c0c12" stroke="url(#voltGrad)" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Inner Dungeon Chamber Grid -->
  <polygon points="32,10 52,21 52,43 32,54 12,43 12,21" fill="#13131d" stroke="#262638" stroke-width="1.5" />

  <!-- Trap Spikes & Portcullis Teeth -->
  <path d="M20 20 L24 28 L28 20 L32 28 L36 20 L40 28 L44 20" stroke="url(#voltGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M20 44 L24 36 L28 44 L32 36 L36 44 L40 36 L44 44" stroke="url(#voltGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Escaping Runner Glyph (Dynamic Core) -->
  <g filter="url(#glow)">
    <polygon points="32,22 42,32 32,42 35,32" fill="url(#acidGrad)" />
    <polygon points="22,32 32,22 29,32" fill="#b9ff3b" opacity="0.9" />
    <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  </g>

  <!-- Hazard Accent Nodes -->
  <circle cx="6" cy="18" r="2.5" fill="#b9ff3b" />
  <circle cx="58" cy="18" r="2.5" fill="#b9ff3b" />
  <circle cx="32" cy="60" r="2.5" fill="#b9ff3b" />
</svg>

